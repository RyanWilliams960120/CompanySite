<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recruiter sign in | DracoinLabs</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="icon" type="image/png" href="../assets/favicon.png" sizes="256x256">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="header header--solid" id="header">
    <nav class="nav container">
      <a href="../index.html" class="logo">
        <img class="logo-mark" src="../assets/logo-mark.svg" alt="" width="32" height="32">
        <span class="logo-text"><span class="logo-name">DracoinLabs</span><span class="logo-tagline">Web3 Infrastructure</span></span>
      </a>
      <span class="ats-nav-label">Recruiter access</span>
    </nav>
  </header>

  <main class="ats-page">
    <div class="container container--narrow">
      <form class="card contact-form" id="adminLoginForm" novalidate>
        <span class="section-label">Hiring</span>
        <h1 class="section-title">Recruiter sign in</h1>
        <p class="section-lead">Access candidate applications for the DracoinLabs engineering team.</p>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required maxlength="120">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required maxlength="200">
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="loginSubmit">Sign in</button>
        <p class="form-status" id="loginStatus" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>

  <script src="../js/admin-login.js"></script>
</body>
</html>
